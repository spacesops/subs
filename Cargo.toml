[workspace]
resolver = "2"
members = [
    "config-origins",
    "core",
    "prover",
    "types",
    "subs",
    "examples/registry-server",
    "tools/wif-to-hex",
]

[workspace.dependencies]
# Internal crates
subs-types = { path = "types" }
subs-prover = { path = "prover" }
subs-core = { path = "core" }

# libveritas / fabric / spacedb / relay
libveritas = { version = "=0.3.0", features = ["elf"] }
libveritas_zk = "=0.1.1"
libveritas_testutil = "=0.3.0"
spacedb = "0.1"
relay = { git = "https://github.com/spacesprotocol/certrelay.git" }
# crates.io fabric >=0.2.4 requires libveritas >=0.3.1; this rev accepts ^0.3 (incl. 0.3.0)
fabric = { package = "fabric-resolver", git = "https://github.com/spacesprotocol/certrelay.git", rev = "5efa1cb3371b87dafcba5b69820aa58b83e1edb4" }

# Spaces protocol crates
spaces_protocol = { version = "=0.2.1", features = ["std"] }
spaces_nums = { version = "=0.2.1", features = ["std"] }
spaces_client = { version = "=0.2.1" }
spaces_wallet = "=0.2.1"
spaces_testutil = { git = "https://github.com/spacesprotocol/spaces.git", branch = "subspaces" }

# Common third-party deps
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
hex = "0.4"
borsh = { version = "1.5", default-features = false, features = ["derive"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
tokio = { version = "1" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
bitcoin = { version = "0.32.2", features = ["rand-std"] }
rusqlite = { version = "0.31", features = ["bundled"] }
risc0-zkvm = { version = "3.0.5", features = ["std"] }
tempfile = "3"